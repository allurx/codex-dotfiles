name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-dotfiles-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      site_artifact_id: ${{ steps.site_artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Build and verify document tree
        run: npm run verify

      - name: Upload verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: site_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-dotfiles-site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Record build provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SITE_ARTIFACT_ID: ${{ steps.site_artifact.outputs.artifact-id }}
        run: |
          {
            printf 'Source commit: `%s`\n\n' "$SOURCE_COMMIT"
            printf 'Artifact ID: `%s`\n\n' "$SITE_ARTIFACT_ID"
            printf '```json\n'
            cat work/build-manifest.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download verified site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.site_artifact_id }}
          path: dist/
          merge-multiple: true

      - name: Check deployment is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$branch_head" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because main has a newer commit."
          fi

      - name: Deploy verified site
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN before deploying."
            exit 1
          fi
          npm run deploy:production -- --message "Source commit: $GITHUB_SHA"

      - name: Verify published document tree
        if: steps.current.outputs.deploy == 'true'
        run: npm run check:deployment -- https://codex-dotfiles.allurx.workers.dev

      - name: Record published site
        if: steps.current.outputs.deploy == 'true'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          {
            printf 'Published https://codex-dotfiles.allurx.workers.dev\n\n'
            printf 'Verified source commit: `%s`\n' "$SOURCE_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
